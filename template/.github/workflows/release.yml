name: release

# Runs only after CI has passed on a push to main, so a red commit never ships.
# (A "required status check" only gates PR merges; it can't stop a push-triggered
# workflow.) Hosting: https://mohanz1.github.io/discord-bot-base/hosting/
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time; never cancel a half-finished deploy.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI just passed — not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag and label with the commit CI tested: in a workflow_run, github.sha is
      # main's tip, which may already be a newer commit.
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Off until the bot is on a host: `add-bot` there, add the DEPLOY_* secrets, then
    # set the repo variable DEPLOY_ENABLED=true. Until then every green push to main
    # still builds and pushes the image.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # The host pins this key to `deploy <this bot>` (add-bot --key): it pulls,
          # snapshots the DB, restarts, and fails unless the bot logs in to Discord.
          # All we send is the commit, which names the DB snapshot.
          ssh -i ~/.ssh/id_ed25519 "deploy@$DEPLOY_HOST" "$SHA"
