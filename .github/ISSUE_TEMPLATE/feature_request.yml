name: Feature request
description: Suggest something for the base
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the base makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the base do? Keep in mind it's a shared foundation, not a place for bot-specific features.
    validations:
      required: true
