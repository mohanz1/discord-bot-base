# Alembic config for discord-bot-base's own schema history.
# Downstream bots generated from template/ get their own copy of this file.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is resolved in alembic/env.py from BOT_DATABASE__URL (falling back to
# a local sqlite file), so this value is only a placeholder.
sqlalchemy.url = sqlite+aiosqlite:///bot.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
