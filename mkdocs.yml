site_name: discord-bot-base
site_description: A modern, uv-first foundation for Discord bots.
site_url: https://mohanz1.github.io/discord-bot-base/
repo_url: https://github.com/mohanz1/discord-bot-base
repo_name: mohanz1/discord-bot-base
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Writing extensions: extensions.md
  - Recipes: recipes.md
  - CLI: cli.md
  - Deployment: deployment.md
  - API reference:
      - botbase.app: reference/app.md
      - botbase.config: reference/config.md
      - botbase.extensions: reference/extensions.md
      - botbase.cog: reference/cog.md
      - botbase.tree: reference/tree.md
      - botbase.errors: reference/errors.md
      - botbase.logs: reference/logs.md
      - botbase.database: reference/database.md
      - botbase.utils: reference/utils.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
